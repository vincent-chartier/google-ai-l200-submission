# Cloud Build CI/CD Pipeline for Cinema Outings Multi-Agent Platform
steps:
  # 1. Run backend unit & integration tests
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r backend/requirements.txt
        PYTHONPATH=. pytest backend/tests/ -v

  # 2. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:latest'
      - '.'

  # 3. Push Docker container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:$COMMIT_SHA'

  # 4. Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:latest'

  # 5. Terraform Format and Validate
  - name: 'hashicorp/terraform:1.9'
    id: 'terraform-validate'
    dir: 'terraform/environments/$_ENV'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init -backend=false
        terraform validate

substitutions:
  _REGION: 'us-central1'
  _ENV: 'prod'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/cinema-outings-$_ENV-repo/cinema-outings:latest'

options:
  logging: CLOUD_LOGGING_ONLY
